name: Publish Release

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 10

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup Firebase Config
        env:
          GOOGLE_SERVICES_SECRET: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_SECRET" ]; then
            echo "$GOOGLE_SERVICES_SECRET" > app/google-services.json
          elif [ ! -f app/google-services.json ]; then
            cp app/google-services.json.example app/google-services.json
          fi

      - name: Extract Version and Commit Info
        id: info
        run: |
          COMMIT_ID=$(git rev-parse --short HEAD)
          echo "commit_id=$COMMIT_ID" >> $GITHUB_OUTPUT

          # Извлекаем versionName из build.gradle.kts
          VERSION_NAME=$(grep 'versionName = ' app/build.gradle.kts | head -n 1 | cut -d'"' -f2)
          if [ -z "$VERSION_NAME" ]; then
            VERSION_NAME="4.0.0"
          fi
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT

          TAG_NAME="v${VERSION_NAME}-${COMMIT_ID}"
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

          # Извлекаем чейнджлог коммита (тема + тело)
          CHANGELOG=$(git log -1 --pretty=format:"### %s%n%n%b")
          {
            echo "changelog<<EOF"
            echo "$CHANGELOG"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Run Tests and Assemble Release APK
        run: |
          ./gradlew testStandaloneDebugUnitTest assembleStandaloneRelease \
            -PcommitId=${{ steps.info.outputs.commit_id }} \
            --parallel \
            --build-cache

      - name: Sign APK (if Keystore is configured)
        id: sign_app
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: app/build/outputs/apk/standalone/release
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Prepare Release Artifact
        id: prepare_artifact
        run: |
          SIGNED_APK="${{ steps.sign_app.outputs.signedReleaseFile }}"
          DEST_NAME="VisorLink-v${{ steps.info.outputs.version_name }}-${{ steps.info.outputs.commit_id }}.apk"

          if [ -n "$SIGNED_APK" ] && [ -f "$SIGNED_APK" ]; then
            mv "$SIGNED_APK" "app/build/outputs/apk/standalone/release/$DEST_NAME"
          else
            # Если ключа подписи в секретах нет, берем сгенерированный apk
            UNSIGNED_APK=$(find app/build/outputs/apk/standalone/release -name "*.apk" | head -n 1)
            mv "$UNSIGNED_APK" "app/build/outputs/apk/standalone/release/$DEST_NAME"
          fi

          echo "apk_path=app/build/outputs/apk/standalone/release/$DEST_NAME" >> $GITHUB_OUTPUT
          echo "apk_name=$DEST_NAME" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.info.outputs.tag_name }}
          name: "VisorLink v${{ steps.info.outputs.version_name }} (${{ steps.info.outputs.commit_id }})"
          body: |
            ## 🚀 What's Changed
            
            ${{ steps.info.outputs.changelog }}
            
            ---
            *Automated release build for commit `${{ steps.info.outputs.commit_id }}`.*
          files: |
            ${{ steps.prepare_artifact.outputs.apk_path }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
