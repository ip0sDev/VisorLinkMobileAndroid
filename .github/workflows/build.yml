name: App Build

on:
  push:
    branches:
      - canary
      - nightly
    tags:
      - 'canary-*'
      - 'nightly-*'
  # Добавляем возможность ручного запуска с выбором канала
  workflow_dispatch:
    inputs:
      channel:
        description: 'Выбери канал сборки'
        required: true
        default: 'canary'
        type: choice
        options:
          - canary
          - nightly

jobs:
  build:
    name: Test & Build Signed APK
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 20

      # НОВЫЙ ШАГ: Определяем канал сборки
      - name: Determine Channel
        id: setup_channel
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            CHANNEL="${{ inputs.channel }}"
          else
            if [[ "${GITHUB_REF_NAME}" == *"nightly"* ]]; then
              CHANNEL="nightly"
            else
              CHANNEL="canary"
            fi
          fi
          
          echo "CHANNEL=$CHANNEL" >> $GITHUB_ENV
          
          # Делаем первую букву заглавной для красивого текста в Telegram (Canary / Nightly)
          CHANNEL_CAP="$(tr '[:lower:]' '[:upper:]' <<< ${CHANNEL:0:1})${CHANNEL:1}"
          echo "CHANNEL_CAP=$CHANNEL_CAP" >> $GITHUB_ENV

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # Устанавливаем 29.0.3, чтобы экшен подписи не ругался
      - name: Install Android Build Tools 29.0.3
        run: echo "y" | sdkmanager "build-tools;29.0.3"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: ${{ github.event_name == 'push' && github.ref != 'refs/heads/canary' && github.ref != 'refs/heads/nightly' }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Get commit info
        id: commit
        run: |
          COMMIT_ID=$(git rev-parse --short HEAD)
          echo "commit_id=$COMMIT_ID" >> $GITHUB_OUTPUT

          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          echo "prev_tag=$PREV_TAG" >> $GITHUB_OUTPUT

          CHANGELOG=$(git log --pretty=format:"* %s" -3)
          {
            echo "changelog<<EOF"
            echo "$CHANGELOG"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      # Передаем канал в Gradle через -PbuildChannel
      - name: Run Tests and Build Release APK
        run: >
          ./gradlew testDebugUnitTest assembleRelease 
          -PcommitId=${{ steps.commit.outputs.commit_id }} 
          -PbuildChannel=${{ env.CHANNEL }} 
          --parallel 
          --build-cache 
          --configuration-cache 
          --no-daemon

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: app/build/reports/tests/testDebugUnitTest/

      - name: Sign APK
        id: sign_app
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      # Имя APK теперь зависит от выбранного канала
      - name: Rename Signed APK
        run: |
          APK_SRC="${{ steps.sign_app.outputs.signedReleaseFile }}"
          APK_NAME="visorlink-${{ env.CHANNEL }}-${{ steps.commit.outputs.commit_id }}.apk"
          APK_DEST="app/build/outputs/apk/release/$APK_NAME"
          mv "$APK_SRC" "$APK_DEST"
          
          echo "APK_PATH=$APK_DEST" >> $GITHUB_ENV
          echo "APK_NAME=$APK_NAME" >> $GITHUB_ENV

      # Текст сообщения тоже динамический
      - name: Send Info to Telegram
        run: |
          PREV_TAG="${{ steps.commit.outputs.prev_tag }}"
          SINCE=${PREV_TAG:-"last 3 commits"}
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          
          TEXT=$(cat << EOF
          🚀 <b>VisorLink ${{ env.CHANNEL_CAP }} Build</b>
          
          📦 <code>${{ env.APK_NAME }}</code>
          🔖 <code>${{ steps.commit.outputs.commit_id }}</code> | 🌿 <code>${GITHUB_REF_NAME}</code>
          👤 <code>${GITHUB_ACTOR}</code>
          ✅ <b>Tests passed & APK Signed</b>
          
          📥 <a href="$RUN_URL">Скачать APK (GitHub Artifacts)</a>
          
          📋 <b>Changelog ($SINCE):</b>
          ${{ steps.commit.outputs.changelog }}
          EOF
          )
          
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "parse_mode=HTML" \
            -d "text=$TEXT"

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: visorlink-${{ env.CHANNEL }}-${{ steps.commit.outputs.commit_id }}
          path: ${{ env.APK_PATH }}
          retention-days: 7