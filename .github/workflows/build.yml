name: App Build

on:
  push:
    branches:
      - canary
      - nightly
    tags:
      - 'canary-*'
      - 'nightly-*'
  workflow_dispatch:

jobs:
  build:
    name: Test & Build Signed APK
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 20

      - name: Extract Channel from BuildConfig
        id: get_channel
        run: |
          RAW_CHANNEL=$(grep 'buildConfigField("String", "CHANNEL"' app/build.gradle.kts | head -n 1 | cut -d'"' -f7)
          CHANNEL=$(echo "$RAW_CHANNEL" | tr '[:upper:]' '[:lower:]')

          if [ -z "$CHANNEL" ]; then
            echo "❌ ОШИБКА: Не удалось найти CHANNEL в build.gradle.kts"
            exit 1
          fi

          echo "CHANNEL=$CHANNEL" >> $GITHUB_ENV

          CHANNEL_CAP="$(tr '[:lower:]' '[:upper:]' <<< ${CHANNEL:0:1})${CHANNEL:1}"
          echo "CHANNEL_CAP=$CHANNEL_CAP" >> $GITHUB_ENV

          if [ "$CHANNEL" = "nightly" ]; then
            echo "CHAT_ID=${{ secrets.TELEGRAM_NIGHTLY_CHAT_ID }}" >> $GITHUB_ENV
          else
            echo "CHAT_ID=${{ secrets.TELEGRAM_CANARY_CHAT_ID }}" >> $GITHUB_ENV
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android Build Tools 29.0.3
        run: echo "y" | sdkmanager "build-tools;29.0.3"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Get commit info
        id: commit
        run: |
          COMMIT_ID=$(git rev-parse --short HEAD)
          echo "commit_id=$COMMIT_ID" >> $GITHUB_OUTPUT

          CHANGELOG=$(git log -1 --pretty=format:"%s" | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g')

          {
            echo "changelog<<EOF"
            echo "$CHANGELOG"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Run Tests and Build Release APK
        run: >
          ./gradlew testDebugUnitTest assembleRelease
          -PcommitId=${{ steps.commit.outputs.commit_id }}
          --parallel
          --build-cache
          --no-daemon

      - name: Sign APK
        id: sign_app
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Rename Signed APK
        run: |
          APK_SRC="${{ steps.sign_app.outputs.signedReleaseFile }}"
          APK_NAME="visorlink-${{ env.CHANNEL }}-${{ steps.commit.outputs.commit_id }}.apk"
          APK_DEST="app/build/outputs/apk/release/$APK_NAME"
          mv "$APK_SRC" "$APK_DEST"

          echo "APK_PATH=$APK_DEST" >> $GITHUB_ENV
          echo "APK_NAME=$APK_NAME" >> $GITHUB_ENV

      - name: Deploy Nightly to Firebase Hosting
        if: env.CHANNEL == 'nightly'
        run: |
          mkdir -p firebase_public
          cp ${{ env.APK_PATH }} firebase_public/app-nightly.apk

          cat > firebase.json << 'EOF'
          {
            "hosting": {
              "public": "firebase_public",
              "ignore": ["firebase.json", "**/.*"],
              "headers": [
                {
                  "source": "**/*.apk",
                  "headers": [
                    { "key": "Content-Type", "value": "application/vnd.android.package-archive" }
                  ]
                }
              ]
            }
          }
          EOF

          curl -sL https://firebase.tools | bash
          firebase deploy --only hosting --token "${{ secrets.FIREBASE_TOKEN }}" --project "${{ secrets.FIREBASE_PROJECT_ID }}"

      - name: Send Info to Telegram
        env:
          CHANNEL_NAME: ${{ env.CHANNEL_CAP }}
          APK_NAME: ${{ env.APK_NAME }}
          COMMIT_ID: ${{ steps.commit.outputs.commit_id }}
          CHANGELOG: ${{ steps.commit.outputs.changelog }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FIREBASE_URL: https://${{ secrets.FIREBASE_PROJECT_ID }}.web.app/app-nightly.apk
          CHANNEL: ${{ env.CHANNEL }}
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ env.CHAT_ID }}
          ACTOR: ${{ github.actor }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$CHANNEL" = "nightly" ]; then
            LINK="📥 <a href=\"${FIREBASE_URL}\">Прямая ссылка (Firebase Nightly)</a>"
          else
            LINK="📥 <a href=\"${RUN_URL}\">Скачать из GitHub Artifacts</a>"
          fi

          printf '🚀 <b>VisorLink %s Build</b>\n\n📦 <code>%s</code>\n🔖 <code>%s</code> | 🌿 <code>%s</code>\n👤 <code>%s</code>\n✅ <b>Tests passed &amp; APK Signed</b>\n\n%s\n\n📋 <b>Latest Commit:</b>\n• %s' \
            "$CHANNEL_NAME" "$APK_NAME" "$COMMIT_ID" "$REF_NAME" "$ACTOR" "$LINK" "$CHANGELOG" \
            > /tmp/tg_message.txt

          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d "chat_id=${CHAT_ID}" \
            -d "parse_mode=HTML" \
            --data-urlencode "text@/tmp/tg_message.txt"

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: visorlink-${{ env.CHANNEL }}-${{ steps.commit.outputs.commit_id }}
          path: ${{ env.APK_PATH }}
          retention-days: 7