name: Canary Build

on:
  push:
    branches:
      - canary
    tags:
      - 'canary-*'

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Get commit info
        id: commit
        run: |
          COMMIT_ID=$(git rev-parse --short HEAD)
          echo "commit_id=$COMMIT_ID" >> $GITHUB_OUTPUT

          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          echo "prev_tag=$PREV_TAG" >> $GITHUB_OUTPUT

          if [ -n "$PREV_TAG" ]; then
            CHANGELOG=$(git log --pretty=format:"* %s" "$PREV_TAG"..HEAD)
          else
            CHANGELOG=$(git log --pretty=format:"* %s" -20)
          fi

          {
            echo "changelog<<EOF"
            echo "$CHANGELOG"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Build Debug APK
        run: ./gradlew assembleDebug -PcommitId=${{ steps.commit.outputs.commit_id }}

      - name: Locate and rename APK
        run: |
          APK_SRC=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
          APK_NAME="visorlink-canary-${{ steps.commit.outputs.commit_id }}.apk"
          APK_DEST="app/build/outputs/apk/debug/$APK_NAME"
          mv "$APK_SRC" "$APK_DEST"
          echo "APK_PATH=$APK_DEST" >> $GITHUB_ENV
          echo "APK_NAME=$APK_NAME" >> $GITHUB_ENV

      - name: Build Telegram message
        id: tg_msg
        run: |
          PREV_TAG="${{ steps.commit.outputs.prev_tag }}"
          if [ -n "$PREV_TAG" ]; then
            SINCE="since $PREV_TAG"
          else
            SINCE="last 20 commits"
          fi

          {
            echo "text<<EOF"
            echo "🐦 VisorLink Canary Build"
            echo ""
            echo "📦 Version: $APK_NAME"
            echo "🔖 Commit: ${{ steps.commit.outputs.commit_id }}"
            echo "🌿 Branch: ${GITHUB_REF_NAME}"
            echo "👤 By: ${GITHUB_ACTOR}"
            echo ""
            echo "📋 Changelog ($SINCE):"
            echo "${{ steps.commit.outputs.changelog }}"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Send APK to Telegram
        run: |
          curl -s -X POST \
            "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendDocument" \
            -F "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -F "document=@${{ env.APK_PATH }}" \
            -F "caption=${{ steps.tg_msg.outputs.text }}"