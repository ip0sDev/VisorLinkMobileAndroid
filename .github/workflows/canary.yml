name: Canary Build

on:
  push:
    branches:
      - canary
    tags:
      - 'canary-*'

jobs:
  build:
    name: Test & Build Signed Canary APK
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/canary' }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Get commit info
        id: commit
        run: |
          COMMIT_ID=$(git rev-parse --short HEAD)
          echo "commit_id=$COMMIT_ID" >> $GITHUB_OUTPUT

          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          echo "prev_tag=$PREV_TAG" >> $GITHUB_OUTPUT

          CHANGELOG=$(git log --pretty=format:"* %s" -3)
          {
            echo "changelog<<EOF"
            echo "$CHANGELOG"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      # Заменили assembleDebug на assembleRelease
      - name: Run Tests and Build Release APK
        run: >
          ./gradlew testDebugUnitTest assembleRelease 
          -PcommitId=${{ steps.commit.outputs.commit_id }} 
          --parallel 
          --build-cache 
          --configuration-cache 
          --no-daemon

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: app/build/reports/tests/testDebugUnitTest/

      # НОВЫЙ ШАГ: Подписываем APK
      - name: Sign APK
        id: sign_app
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      # Переименовываем уже подписанный файл
      - name: Rename Signed APK
        run: |
          APK_SRC="${{ steps.sign_app.outputs.signedReleaseFile }}"
          APK_NAME="visorlink-canary-${{ steps.commit.outputs.commit_id }}.apk"
          APK_DEST="app/build/outputs/apk/release/$APK_NAME"
          mv "$APK_SRC" "$APK_DEST"
          
          echo "APK_PATH=$APK_DEST" >> $GITHUB_ENV
          echo "APK_NAME=$APK_NAME" >> $GITHUB_ENV

      - name: Send Info to Telegram
        run: |
          PREV_TAG="${{ steps.commit.outputs.prev_tag }}"
          SINCE=${PREV_TAG:-"last 3 commits"}
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          
          TEXT=$(cat << EOF
          🐦 <b>VisorLink Canary Build</b>
          
          📦 <code>${{ env.APK_NAME }}</code>
          🔖 <code>${{ steps.commit.outputs.commit_id }}</code> | 🌿 <code>${GITHUB_REF_NAME}</code>
          👤 <code>${GITHUB_ACTOR}</code>
          ✅ <b>Tests passed</b>
          
          📥 <a href="$RUN_URL">Скачать APK (GitHub Artifacts)</a>
          
          📋 <b>Changelog ($SINCE):</b>
          ${{ steps.commit.outputs.changelog }}
          EOF
          )
          
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "parse_mode=HTML" \
            -d "text=$TEXT"

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: visorlink-canary-${{ steps.commit.outputs.commit_id }}
          path: ${{ env.APK_PATH }}
          retention-days: 7