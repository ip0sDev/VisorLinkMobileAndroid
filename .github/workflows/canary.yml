name: Canary Build

on:
  push:
    branches:
      - canary
    tags:
      - 'canary-*'

jobs:
  build:
    name: Test & Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 20 # Достаточно для чейнджлога, экономит время

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --parallel

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: app/build/reports/tests/testDebugUnitTest/

      - name: Get commit info
        id: commit
        run: |
          COMMIT_ID=$(git rev-parse --short HEAD)
          echo "commit_id=$COMMIT_ID" >> $GITHUB_OUTPUT

          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          echo "prev_tag=$PREV_TAG" >> $GITHUB_OUTPUT

          # Собираем последние 3 коммита
          CHANGELOG=$(git log --pretty=format:"* %s" -3)
          {
            echo "changelog<<EOF"
            echo "$CHANGELOG"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Build Debug APK
        run: ./gradlew assembleDebug -PcommitId=${{ steps.commit.outputs.commit_id }} --parallel --build-cache

      - name: Locate and rename APK
        run: |
          APK_SRC=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
          APK_NAME="visorlink-canary-${{ steps.commit.outputs.commit_id }}.apk"
          APK_DEST="app/build/outputs/apk/debug/$APK_NAME"
          mv "$APK_SRC" "$APK_DEST"
          echo "APK_PATH=$APK_DEST" >> $GITHUB_ENV
          echo "APK_NAME=$APK_NAME" >> $GITHUB_ENV

      - - name: Send Info to Telegram
        run: |
          PREV_TAG="${{ steps.commit.outputs.prev_tag }}"
          SINCE=${PREV_TAG:-"last 3 commits"}
          
          # Формируем текст
          TEXT="🐦 *VisorLink Canary Build*
          
          📦 \`${{ env.APK_NAME }}\`
          🔖 \`${{ steps.commit.outputs.commit_id }}\` | 🌿 \`${GITHUB_REF_NAME}\`
          👤 \`${GITHUB_ACTOR}\`
          ✅ *Tests passed*
          
          📋 *Changelog ($SINCE):*
          ${{ steps.commit.outputs.changelog }}"
          
          # Отправляем текст
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "parse_mode=Markdown" \
            -d "text=$TEXT"

      - name: Send APK to Telegram
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendDocument" \
            -F "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -F "document=@${{ env.APK_PATH }}" \
            -F "caption=📦 Build ready"