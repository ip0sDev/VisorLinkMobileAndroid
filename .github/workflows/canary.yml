name: Canary Build

on:
  push:
    branches:
      - canary
    tags:
      - 'canary-*'

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # нужно для git log (changelog)

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Get commit info
        id: commit
        run: |
          COMMIT_ID=$(git rev-parse --short HEAD)
          echo "commit_id=$COMMIT_ID" >> $GITHUB_OUTPUT

          # Changelog: коммиты от предыдущего тега до HEAD
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            CHANGELOG=$(git log --pretty=format:"• %s" "$PREV_TAG"..HEAD)
          else
            CHANGELOG=$(git log --pretty=format:"• %s" -20)
          fi

          # Экранируем для multiline output
          {
            echo "changelog<<EOF"
            echo "$CHANGELOG"
            echo "EOF"
          } >> $GITHUB_OUTPUT

          echo "prev_tag=$PREV_TAG" >> $GITHUB_OUTPUT

      - name: Build Debug APK
        run: ./gradlew assembleDebug -PcommitId=${{ steps.commit.outputs.commit_id }}

      - name: Rename APK
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
          NEW_NAME="visorlink-canary-${{ steps.commit.outputs.commit_id }}.apk"
          mv "$APK_PATH" "app/build/outputs/apk/debug/$NEW_NAME"
          echo "apk_path=app/build/outputs/apk/debug/$NEW_NAME" >> $GITHUB_ENV
          echo "apk_name=$NEW_NAME" >> $GITHUB_ENV

      - name: Send to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          COMMIT_ID="${{ steps.commit.outputs.commit_id }}"
          PREV_TAG="${{ steps.commit.outputs.prev_tag }}"
          CHANGELOG="${{ steps.commit.outputs.changelog }}"
          BRANCH="${GITHUB_REF_NAME}"
          ACTOR="${GITHUB_ACTOR}"

          if [ -n "$PREV_TAG" ]; then
            SINCE_TEXT="since \`$PREV_TAG\`"
          else
            SINCE_TEXT="last 20 commits"
          fi

          # Формируем текст сообщения
          MESSAGE="🐦 *VisorLink Canary Build*
          
📦 *Version:* \`${{ env.apk_name }}\`
🔖 *Commit:* \`$COMMIT_ID\`
🌿 *Branch:* \`$BRANCH\`
👤 *By:* $ACTOR

📋 *Changelog* ($SINCE_TEXT):
$CHANGELOG"

          # Отправляем APK с подписью
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
            -F chat_id="${TELEGRAM_CHAT_ID}" \
            -F document=@"${{ env.apk_path }}" \
            -F caption="$MESSAGE" \
            -F parse_mode="Markdown"