name: Test CI Connection (Service Tokens)

on:
  workflow_dispatch:

jobs:
  test-network:
    runs-on: ubuntu-latest

    steps:
      - name: Create fake APK
        run: echo "This is just a test file, not a real APK" > dummy.apk

      - name: Test 1 - WITHOUT Tokens (Should Fail)
        env:
          SERVER_URL: ${{ secrets.UPDATER_SERVER_URL }}
          API_KEY: ${{ secrets.UPDATER_API_KEY }}
        run: |
          echo "Отправляем запрос БЕЗ CF-токенов..."
          
          HTTP_STATUS=$(curl -sS -o /tmp/response1.json -w "%{http_code}" \
            -A "VisorLink-CI-Bot/1.0" \
            -X POST "$SERVER_URL/api/upload" \
            -H "X-API-Key: $API_KEY" \
            -F "file=@dummy.apk" \
            -F "channel=canary" \
            -F "changelog=Test ping" || echo "000")
            
          echo "HTTP Status Code: $HTTP_STATUS"

          if [ "$HTTP_STATUS" = "403" ] || [ "$HTTP_STATUS" = "302" ]; then
            echo "✅ УСПЕХ ТЕСТА 1: Cloudflare заблокировал запрос (Bot Fight Mode / Zero Trust работает)."
          elif [ "$HTTP_STATUS" = "400" ]; then
            echo "❌ ПРОВАЛ ТЕСТА 1: Запрос прошел без токенов. Вы точно включили Bot Fight Mode обратно?"
            exit 1
          else
            echo "⚠️ Неожиданный статус: $HTTP_STATUS"
            cat /tmp/response1.json
            exit 1
          fi

      - name: Test 2 - WITH Tokens (Should Succeed)
        env:
          SERVER_URL: ${{ secrets.UPDATER_SERVER_URL }}
          API_KEY: ${{ secrets.UPDATER_API_KEY }}
          CF_CLIENT_ID: ${{ secrets.CF_CLIENT_ID }}
          CF_CLIENT_SECRET: ${{ secrets.CF_CLIENT_SECRET }}
        run: |
          echo "========================================"
          echo "Отправляем запрос С CF-токенами..."
          
          HTTP_STATUS=$(curl -sS -o /tmp/response2.json -w "%{http_code}" \
            -A "VisorLink-CI-Bot/1.0" \
            -X POST "$SERVER_URL/api/upload" \
            -H "X-API-Key: $API_KEY" \
            -H "CF-Access-Client-Id: $CF_CLIENT_ID" \
            -H "CF-Access-Client-Secret: $CF_CLIENT_SECRET" \
            -F "file=@dummy.apk" \
            -F "channel=canary" \
            -F "changelog=Test ping" || echo "000")
            
          echo "HTTP Status Code: $HTTP_STATUS"
          echo "Server Response:"
          cat /tmp/response2.json || echo "[Empty response]"

          if [ "$HTTP_STATUS" = "400" ]; then
            echo -e "\n✅ УСПЕХ ТЕСТА 2! Токены сработали. Запрос пробил Cloudflare и дошел до Go-сервера (ошибка zip)."
            exit 0
          else
            echo -e "\n❌ ПРОВАЛ ТЕСТА 2: Токены не помогли. Статус: $HTTP_STATUS"
            echo "Проверьте политику Service Auth в Zero Trust!"
            exit 1
          fi
