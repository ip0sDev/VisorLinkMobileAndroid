name: CI
on:
  push:
    branches:
      - main
      - canary
      - beta
  pull_request:
    branches:
      - main
      - canary
      - beta

jobs:
  test:
    name: Unit Tests & Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Setup Firebase Config (Fallback)
        run: |
          if [ ! -f app/google-services.json ]; then
            cp app/google-services.json.example app/google-services.json
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: UI rules (цвета и M3-компоненты в экранах)
        run: ./gradlew checkUiRules --no-daemon

      # compare, а не verify: эталоны сняты на Windows, а на Linux сглаживание шрифтов
      # может отличаться на пиксели. Пока не убедились, что эталоны совпадают, CI
      # только выкладывает диффы артефактом и не падает. Потом заменить на verifyRoborazziPlayDebug.
      - name: Run JVM Unit Tests + screenshot compare
        run: ./gradlew compareRoborazziPlayDebug --no-daemon

      - name: Upload screenshot diffs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roborazzi-diffs
          path: app/build/outputs/roborazzi
          if-no-files-found: ignore

      - name: Assemble Debug APK
        run: ./gradlew assemblePlayDebug --no-daemon
